name = "beauty-salon-success"
main = "dist/_worker.js"
compatibility_date = "2026-10-20"
# honox の useRequestContext が使う nodejs_compat は 2026-08-04 以降デフォルト有効のため指定不要
# 本番は workers.dev を無効化。Access で /admin を保護するのはカスタムドメインのみのため、
# workers.dev 経由の素通り（Access バイパス）を塞ぐ。
workers_dev = false

# 本番カスタムドメイン。Pages から移行済み(2026-06-19)。
routes = [
  { pattern = "success-salon.haton14.com", custom_domain = true },
]

# お知らせ（臨時休業など）の保存先 KV。
[[kv_namespaces]]
binding = "NOTICE"
id = "87b8ce65d1ec40dc8679d4a2a9b11509"

# /api/notice のレート制限（同一IP 60回/分）。Cloudflare のロケーション単位で近似適用。
[[ratelimits]]
name = "NOTICE_RATE_LIMITER"
namespace_id = "9001"

[ratelimits.simple]
limit = 60
period = 60

# ビルドは package.json の deploy script（pnpm run build && wrangler deploy）で行うため
# [build] は定義しない（定義すると wrangler がもう一度フルビルドして二重になる）

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"

# Workers Logs / Workers Traces（オブザーバビリティ）を有効化
[observability]
enabled = true

[observability.traces]
enabled = true

# プレビュー環境（pnpm deploy:preview で使用）
[env.preview]
name = "beauty-salon-success-preview"
# 本番の routes（カスタムドメイン）を継承しないよう明示的に空にする。
# 継承するとプレビューのデプロイが本番ドメインを奪ってしまう。
routes = []
# プレビューはカスタムドメインを持たないため workers.dev で到達する。
# 注意: プレビューの /admin は Access 未保護（検証用途）。本番のみが保護対象。
workers_dev = true

[env.preview.assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"

# プレビュー用 KV。
[[env.preview.kv_namespaces]]
binding = "NOTICE"
id = "4f266f0c466142c0a439119a0ea30152"

# プレビュー用レート制限（本番とはカウンターを分離）。
[[env.preview.ratelimits]]
name = "NOTICE_RATE_LIMITER"
namespace_id = "9002"

[env.preview.ratelimits.simple]
limit = 60
period = 60
